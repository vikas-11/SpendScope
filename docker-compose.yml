services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spendscope
      POSTGRES_USER: spendscope
      POSTGRES_PASSWORD: spendscope
    volumes:
      - spendscope_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendscope -d spendscope"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://spendscope:spendscope@db:5432/spendscope
      SECRET_KEY: local-docker-secret-change-before-production-please-rotate
      FRONTEND_URL: http://localhost:5173
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  spendscope_data:
